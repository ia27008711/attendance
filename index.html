<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>出席管理</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1e24;--sub:#6b7280;--bd:#e3e6ea;--ok:#2e9e5b;--mid:#d9a400;--warn:#e8730c;--zero:#d93a3a;--over:#8e24aa;--none:#9aa1ab;--ac:#2f6fed;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2126;--tx:#eceef2;--sub:#98a0ac;--bd:#2c3038;--ac:#6b9bff}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2126;--tx:#eceef2;--sub:#98a0ac;--bd:#2c3038;--ac:#6b9bff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:4px 0 10px}h2{font-size:15px;margin:18px 0 8px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.big{width:100%;padding:16px;font-size:18px;font-weight:700;border:0;border-radius:14px;background:var(--zero);color:#fff}
.big.undo{background:var(--none)}
.btn{padding:8px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;font-size:14px}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}
.subj{border-left:8px solid var(--c);}
.badge{font-weight:700;font-size:14px;padding:2px 10px;border-radius:99px;color:#fff;background:var(--st)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--st)}
.ok{--st:var(--ok)}.mid{--st:var(--mid)}.warn{--st:var(--warn)}.zero{--st:var(--zero)}.over{--st:var(--over)}.none{--st:var(--none)}
input[type=text],input[type=number]{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
input[type=number]{width:64px}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--bd);font-size:13px;margin:2px}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#modal .card{max-width:340px;width:100%;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;display:none;z-index:10}
.legend span{display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:12px;color:var(--sub)}.legend b{width:10px;height:10px;border-radius:50%;background:var(--st);display:inline-block}
</style></head><body><main>
<h1>📚 出席管理</h1>
<div class="tabs"><button id="t1" class="on">出席状況</button><button id="t2">設定</button></div>
<div id="v1"></div><div id="v2" style="display:none"></div>
</main>
<div id="modal"><div class="card"><div style="font-size:20px;font-weight:700;margin-bottom:6px">今日は休む？</div><div id="mtxt" class="sub" style="margin-bottom:14px"></div><div class="row"><button class="btn" style="flex:1" id="mno">やめる</button><button class="btn p" style="flex:1;background:var(--zero);border-color:var(--zero)" id="myes">休む</button></div></div></div>
<div id="toast"></div>
<script>
const K="attendance_v1";
let S={sub:[],tt:{1:[],2:[],3:[],4:[],5:[]},log:{}};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PAL=["#e5484d","#f76b15","#e0a500","#30a46c","#12a594","#0091ff","#3e63dd","#8e4ec6","#d6409f","#7c6f64"];
const DN=["日","月","火","水","木","金","土"];
const now=()=>new Date(),ds=()=>{const d=now();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const todayList=()=>S.tt[now().getDay()]||[];
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2400)}
function stat(s){if(!s.limit)return{c:"none",r:"—",p:0};const rem=s.limit-s.abs;const ra=rem/s.limit;
 return{c:rem<0?"over":rem===0?"zero":ra<=.25?"warn":ra<=.5?"mid":"ok",r:rem<0?"超過 "+(-rem):"残り "+rem,p:Math.min(100,Math.max(0,s.abs/s.limit*100))}}
function ensure(names){names.forEach(n=>{if(n&&!S.sub.find(s=>s.n===n))S.sub.push({n,abs:0,limit:0})})}
function skip(){const d=ds(),l=todayList();
 if(!l.length){toast("今日の時間割がありません（設定で入力）");return}
 l.forEach(n=>{const s=S.sub.find(x=>x.n===n);if(s)s.abs++});S.log[d]=l.slice();save();render();toast("今日を欠席にしました（"+l.length+"コマ）")}
function undo(){const d=ds();(S.log[d]||[]).forEach(n=>{const s=S.sub.find(x=>x.n===n);if(s&&s.abs>0)s.abs--});delete S.log[d];save();render();toast("取り消しました")}
function render(){
 const d=now(),l=todayList(),done=!!S.log[ds()];
 let h=`<div class="card"><div class="row sp"><b>${d.getMonth()+1}/${d.getDate()}（${DN[d.getDay()]}）</b><span class="sub">${l.length}コマ</span></div>
 <div style="margin:6px 0 10px">${l.length?l.map(n=>`<span class="tag">${esc(n)}</span>`).join(""):'<span class="sub">今日は授業なし／時間割未設定</span>'}</div>
 <button class="big ${done?"undo":""}" id="skipb">${done?"↩ 今日の欠席を取り消す":"🤒 今日は休む"}</button></div>`;
 h+=`<div class="legend"><span class="ok"><b></b>余裕</span><span class="mid"><b></b>半分以下</span><span class="warn"><b></b>あと少し</span><span class="zero"><b></b>ゼロ</span><span class="over"><b></b>超過</span></div><h2>科目別の猶予時数</h2>`;
 if(!S.sub.length)h+=`<div class="card sub">まだ科目がありません。「設定」で科目と時間割を入力してください。</div>`;
 const so=S.sub.map((s,i)=>({s,i,k:s.limit?(s.limit-s.abs)/s.limit:9})).sort((a,b)=>a.k-b.k);
 so.forEach(({s,i})=>{const t=stat(s);h+=`<div class="card subj ${t.c}" style="--c:${PAL[i%PAL.length]}"><div class="row sp"><b>${esc(s.n)}</b><span class="badge">${t.r}</span></div>
 <div class="sub">欠課 ${s.abs} / 猶予 ${s.limit||"未設定"}</div><div class="bar"><i style="width:${t.p}%"></i></div></div>`});
 $("v1").innerHTML=h;const b=$("skipb");if(b)b.onclick=done?undo:skip;
 renderSet()}
function renderSet(){
 let h=`<h2>✍️ 科目（手入力）</h2>`;
 S.sub.forEach((s,i)=>{h+=`<div class="card"><div class="row"><input type="text" data-i="${i}" data-f="n" value="${esc(s.n)}"><button class="btn" data-del="${i}">削除</button></div>
 <div class="row" style="margin-top:8px"><span class="sub">欠課</span><input type="number" min="0" data-i="${i}" data-f="abs" value="${s.abs}"><span class="sub">猶予（上限）</span><input type="number" min="0" data-i="${i}" data-f="limit" value="${s.limit}"></div></div>`});
 h+=`<button class="btn" id="add">＋ 科目を追加</button><h2>🗓 曜日ごとの科目</h2><div class="card"><div class="sub" style="margin-bottom:6px">1日の科目を「、」か「,」区切りで順番に（同じ科目が2コマなら2回書く）</div>`;
 for(let d=1;d<=5;d++)h+=`<div class="row" style="margin-bottom:6px"><b style="width:22px">${DN[d]}</b><input type="text" data-tt="${d}" value="${esc((S.tt[d]||[]).join("、"))}"></div>`;
 h+=`</div><h2>📱 ホーム画面ボタン</h2><div class="card"><div class="sub">下のリンクをスマホのブラウザで開き、「ホーム画面に追加」すると、タップで「今日は休む？」が出ます。</div>
 <input type="text" readonly id="lk" style="margin:8px 0" value="${esc(location.href.split(/[?#]/)[0]+"?skip=1")}"><button class="btn" id="cp">リンクをコピー</button>
 <div class="sub" style="margin-top:8px">iPhone: 共有ボタン→ホーム画面に追加 ／ Android: メニュー→ホーム画面に追加</div></div>
 <button class="btn" id="rst" style="margin-top:14px">全データを消去</button>`;
 $("v2").innerHTML=h;
 $("v2").querySelectorAll("[data-f]").forEach(e=>e.onchange=()=>{const s=S.sub[e.dataset.i],f=e.dataset.f;s[f]=f==="n"?e.value.trim():Math.max(0,+e.value||0);save();render()});
 $("v2").querySelectorAll("[data-del]").forEach(e=>e.onclick=()=>{S.sub.splice(e.dataset.del,1);save();render()});
 $("v2").querySelectorAll("[data-tt]").forEach(e=>e.onchange=()=>{const a=e.value.split(/[、,，\s]+/).map(x=>x.trim()).filter(Boolean);S.tt[e.dataset.tt]=a;ensure(a);save();render()});
 $("add").onclick=()=>{S.sub.push({n:"新しい科目",abs:0,limit:0});save();render()};
 $("cp").onclick=()=>{const l=$("lk");l.select();try{navigator.clipboard.writeText(l.value);toast("コピーしました")}catch(e){toast("長押ししてコピーしてください")}};
 $("rst").onclick=()=>{if(confirm("全データを消去しますか？")){S={sub:[],tt:{1:[],2:[],3:[],4:[],5:[]},log:{}};save();render()}};
}
function tab(n){$("v1").style.display=n===1?"":"none";$("v2").style.display=n===2?"":"none";$("t1").className=n===1?"on":"";$("t2").className=n===2?"on":""}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
function ask(){const l=todayList();if(S.log[ds()]){toast("今日はすでに欠席済みです");return}
 $("mtxt").textContent=l.length?"今日の"+l.length+"コマを欠席にして猶予時数を減らします":"今日の時間割が未設定です";
 $("modal").style.display="flex";$("mno").onclick=()=>$("modal").style.display="none";$("myes").onclick=()=>{$("modal").style.display="none";skip()}}
render();
if(/skip/.test(location.search+location.hash))ask();
</script></body></html>
